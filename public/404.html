<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — WELLKNEWS</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#000000" />

    <!--
      하위 프로젝트의 깊은 주소는 여기서 되돌려 보낸다.

      GitHub Pages에는 `/;/session/...`이나 `/mamaboy/article/...`에 해당하는
      파일이 없어 이 페이지가 뜬다. 원래 경로를 ?p=에 실어 그 프로젝트의 문서로
      넘기면, 그쪽 라우터가 주소창을 복원한 뒤 평소처럼 그 페이지를 그린다.

      이미 ?p=를 달고 다시 여기 도착했다면 프로젝트 문서 자체를 찾지 못한
      것이므로 더 보내지 않는다. 무한 리다이렉트를 막는 장치다.
    -->
    <script>
      ;(function () {
        var path = location.pathname
        var lower = path.toLowerCase()

        // 세미콜론은 일부 클라이언트가 %3B로 인코딩해 보내므로 두 가지를 함께 본다.
        var projects = [
          { home: '/;/', hit: path.indexOf('/;') === 0 || lower.indexOf('/%3b') === 0 },
          { home: '/mamaboy/', hit: lower.indexOf('/mamaboy/') === 0 },
        ]

        if (location.search.indexOf('p=') !== -1) return

        for (var i = 0; i < projects.length; i++) {
          if (projects[i].hit) {
            location.replace(
              projects[i].home + '?p=' + encodeURIComponent(path + location.search + location.hash),
            )
            return
          }
        }
      })()
    </script>

    <style>
      :root {
        color-scheme: dark;
        font-family:
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Apple SD Gothic Neo',
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        background: #000;
        color: #f2f2ef;
      }

      body::before,
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      body::before {
        background: url('/media/404-signal.webp') center / cover no-repeat;
        opacity: 0.72;
        animation: tune-in 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      body::after {
        background:
          radial-gradient(
            circle at center,
            transparent 0 18%,
            rgb(0 0 0 / 0.22) 56%,
            rgb(0 0 0 / 0.7)
          ),
          linear-gradient(rgb(0 0 0 / 0.12), rgb(0 0 0 / 0.12));
      }

      main {
        position: relative;
        z-index: 1;
        min-height: 100svh;
        display: grid;
        place-content: center;
        justify-items: center;
        padding: 32px;
        text-align: center;
      }

      .mark {
        width: clamp(76px, 11vw, 116px);
        height: auto;
        margin-bottom: 34px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 14px;
        color: #a8a8a2;
        font-size: 12px;
        letter-spacing: 0.18em;
      }

      .status::before {
        content: '';
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #ff3b30;
        box-shadow: 0 0 14px rgb(255 59 48 / 0.7);
      }

      h1 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(4.5rem, 12vw, 9rem);
        font-weight: 400;
        line-height: 0.8;
        letter-spacing: -0.05em;
      }

      .message {
        margin: 30px 0 26px;
        color: #a8a8a2;
        font-size: clamp(14px, 1.8vw, 16px);
        word-break: keep-all;
      }

      a {
        position: relative;
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        color: inherit;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-decoration: none;
      }

      a::after {
        content: '';
        position: absolute;
        right: 0;
        bottom: 8px;
        left: 0;
        height: 1px;
        background: currentColor;
        transform-origin: left;
        transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      a:hover::after {
        transform: scaleX(0.35);
      }

      a:focus-visible {
        outline: 2px solid #f2f2ef;
        outline-offset: 5px;
      }

      @keyframes tune-in {
        from {
          opacity: 0;
          transform: scale(1.03);
        }
      }

      @media (max-width: 639px) {
        body::before {
          opacity: 0.58;
        }

        .mark {
          margin-bottom: 28px;
        }

        .message {
          margin-top: 26px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body::before,
        a::after {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/logo.svg" alt="" width="512" height="512" />
      <p class="status">SIGNAL LOST</p>
      <h1>404</h1>
      <p class="message">신호가 닿지 않는 페이지입니다.</p>
      <a href="/">처음으로 돌아가기</a>
    </main>
  </body>
</html>
