<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>SEMICOLON</title>
    <meta
      name="description"
      content="바쁜 삶 속의 세미콜론. 경계를 가진 경험을 하나씩 떼어내 분석하고, 그 사이 이어지는 생각을 남긴다."
    />
    <link rel="canonical" href="https://wellknews.github.io/;" />

    <!-- 입구(WELLKNEWS)와 달리 이곳은 백색 공간이다. 브라우저 UI도 같은 색으로 맞춘다. -->
    <meta name="theme-color" content="#fafaf8" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" href="/semicolon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/semicolon-touch.png" />

    <!--
      첫 화면이 미리 받아야 할 이미지는 없다. 이 공간의 인터페이스는 색과 공간과
      기호로만 되어 있고, 사진은 SESSION 본문 안에서만 등장한다. 아래 og:image는
      링크를 공유했을 때 쓰이는 보조 자산이지 이 공간의 정체성이 아니다.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SEMICOLON" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://wellknews.github.io/;" />
    <meta property="og:title" content="SEMICOLON" />
    <meta property="og:description" content="바쁜 삶 속의 세미콜론." />
    <meta property="og:image" content="https://wellknews.github.io/semicolon-og-cool.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="종이 띠가 고리로 들렸다 다시 이어지는 정물" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; color: #111111; font-family: Georgia, serif">
        SEMICOLON은 경험을 분석하고 생각을 이어가는 공간입니다. 이 페이지를 보려면 자바스크립트를
        켜주세요. <a href="/" style="color: inherit">WELLKNEWS로 돌아가기</a>
      </p>
    </noscript>
    <script type="module" src="/src/semicolon/main.tsx"></script>
  </body>
</html>
