# 등록된 RSS 소스가 실제로 응답하는지 확인한다.
#
# 개발 환경에서는 바깥으로 나가는 요청이 막혀 있어 확인할 수 없다. 러너에서는
# 열려 있으므로 여기서 두드려 보고 로그로 읽는다. 아무것도 커밋하지 않는다 —
# 무엇을 켜도 되는지 판단하기 위한 검사일 뿐이고, 켜는 결정은 사람이 한다.
name: MAMABOY source probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Probe every registered source
        run: node scripts/mamaboy/probe-sources.mjs
