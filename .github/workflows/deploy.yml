name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # MAMABOY의 피드가 갱신되면 그 결과를 품고 다시 배포한다. 봇이 만든 커밋은
  # push 이벤트를 일으키지 않으므로, 그 워크플로의 완료를 직접 듣는다.
  workflow_run:
    workflows: ['MAMABOY feed']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 포맷·린트·타입 검사를 배포와 분리해, 깨진 코드가 main에 올라가도
  # 그대로 배포되는 일이 없게 한다.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Facing AI가 부르는 워커. 저장소의 .env에도 같은 값이 있지만, 배포되는
          # 주소는 워크플로 안에서도 읽혀야 한다. 키가 아니라 공개 엔드포인트다.
          VITE_FACING_API_URL: https://mamaboy-facing-ai.choi-sinho.workers.dev/facing

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # 배포는 main에 실제로 반영된 경우에만 — PR 검사 때는 돌지 않는다.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
