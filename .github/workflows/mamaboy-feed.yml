# MAMABOY의 지면을 채우는 데이터를 주기적으로 만든다.
#
# 프론트엔드는 RSS에 직접 접근하지 않는다(§35). 여기서 수집·정규화·중복 제거·
# 번역까지 끝내고 결과 JSON을 커밋하면, 다음 배포가 그 파일을 품고 나간다.
#
# 소스가 하나도 켜져 있지 않으면 스크립트는 아무것도 쓰지 않고 끝난다.
# 그동안 지면은 예시 데이터(src/mamaboy/content/seed.ts)로 그려진다.
name: MAMABOY feed

on:
  schedule:
    # 여섯 시간마다. RSS는 그보다 자주 볼 이유가 없고, 자주 볼수록 소스에 부담이 된다.
    - cron: '17 */6 * * *'
  workflow_dispatch:

# 커밋을 만들어야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

concurrency:
  group: mamaboy-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect and translate
        # 키가 없으면 번역 단계만 건너뛴다. 수집 자체는 그대로 끝난다.
        #
        # Azure Translator의 무료 티어가 달마다 200만 자를 준다. 한도를 넘으면
        # 과금되는 것이 아니라 429/403이 오고, 그 글은 원문 그대로 걸린다.
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/mamaboy/build-feed.mjs

      - name: Commit when the feed changed
        run: |
          if [ -z "$(git status --porcelain src/mamaboy/content/generated)" ]; then
            echo "변한 것이 없다. 커밋하지 않는다."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/mamaboy/content/generated
          git commit -m "Refresh the MAMABOY feed"
          git push
