name: Release

# 릴리즈 노트를 하나 추가하는 것이 곧 릴리즈다.
#
# docs/releases/<태그>.md 를 main에 올리면 그 파일이 태그와 GitHub Release가
# 된다. 노트를 먼저 쓰고 따로 릴리즈를 만드는 절차를 두지 않는 이유는, 두
# 단계로 나누면 둘이 어긋난 채 남을 자리가 생기기 때문이다. 저장소 안의
# 파일이 원본이고 Release는 그 사본이다.
on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/*.md'
      # 맞추는 방식을 고쳤으면 이미 나간 릴리즈도 다시 맞춰져야 한다.
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 릴리즈를 노트에 맞춘다.
      #
      # 처음에는 «없으면 만들고 있으면 건너뛴다»로 두었는데, 그러면 어쩌다
      # 빈 릴리즈가 먼저 만들어진 경우 영원히 빈 채로 남는다. 실제로 v1.1.0이
      # 제목도 본문도 없이 먼저 생겼고, 워크플로는 «이미 있음»이라며 지나갔다.
      #
      # 있고 없고를 보는 대신 내용이 같은지를 본다. 저장소 안의 파일이 원본이고
      # Release는 그 사본이므로, 사본이 원본과 다르면 사본을 고친다. 여러 번
      # 돌려도 결과가 같고, 어긋난 것은 다음 실행에서 저절로 맞는다.
      - name: Make each release match its note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          created=0
          synced=0

          for file in docs/releases/*.md; do
            tag="$(basename "$file" .md)"

            # 노트의 첫 제목 줄이 릴리즈 이름이 된다. 이름을 두 곳에 적지 않는다.
            title="$(sed -n 's/^# \(.*\)/\1/p' "$file" | head -1)"
            [ -n "$title" ] || title="$tag"

            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes-file "$file"
              echo "$tag — created as \"$title\""
              created=$((created + 1))
              continue
            fi

            # GitHub은 본문을 CRLF로 돌려준다. 줄 끝만 다른 것을 «다르다»고
            # 보면 실행할 때마다 고치게 되므로 비교 전에 맞춘다.
            gh release view "$tag" --json body --jq .body | sed 's/\r$//' > /tmp/current-body.md
            current_title="$(gh release view "$tag" --json name --jq .name)"

            if [ "$current_title" = "$title" ] && cmp -s /tmp/current-body.md "$file"; then
              echo "$tag — up to date"
              continue
            fi

            gh release edit "$tag" --title "$title" --notes-file "$file"
            echo "$tag — synced to $file"
            synced=$((synced + 1))
          done

          echo "created: $created, synced: $synced"
