name: Release

# 릴리즈 노트를 하나 추가하는 것이 곧 릴리즈다.
#
# docs/releases/<태그>.md 를 main에 올리면 그 파일이 태그와 GitHub Release가
# 된다. 노트를 먼저 쓰고 따로 릴리즈를 만드는 절차를 두지 않는 이유는, 두
# 단계로 나누면 둘이 어긋난 채 남을 자리가 생기기 때문이다. 저장소 안의
# 파일이 원본이고 Release는 그 사본이다.
on:
  push:
    branches: [main]
    paths: ['docs/releases/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 이미 릴리즈가 있는 노트는 건너뛴다. 여러 번 돌려도 결과가 같아야
      # 손으로 다시 돌리는 일이 무섭지 않다.
      - name: Publish release notes that have no release yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          made=0

          for file in docs/releases/*.md; do
            tag="$(basename "$file" .md)"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag — already released, skipping"
              continue
            fi

            # 노트의 첫 제목 줄이 릴리즈 이름이 된다. 이름을 두 곳에 적지 않는다.
            title="$(sed -n 's/^# \(.*\)/\1/p' "$file" | head -1)"
            [ -n "$title" ] || title="$tag"

            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$file"

            echo "$tag — released as \"$title\""
            made=$((made + 1))
          done

          echo "created: $made"
